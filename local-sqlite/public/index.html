<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Todo</title>
<style>
  :root {
    --bg: #f6f4ff; --card: #ffffff; --ink: #2b2840; --muted: #8a86a3; --line: #e7e3f7;
    --accent: #7c6cf2; --accent-soft: #eeebff; --danger: #e5566a; --danger-soft: #ffe9ec;
    --ok: #1f9d6b; --ok-soft: #e3f7ee; --warn-soft: #fff4dd; --warn: #b77400;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
  .stack > * + * { margin-top: 12px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { margin: 0; font-size: 30px; letter-spacing: -0.5px; }
  .mode { font-size: 12px; padding: 5px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: 0 4px 18px rgba(124,108,242,.07); }
  input, select { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); min-width: 0; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input[type=color] { padding: 2px; width: 44px; height: 42px; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; font-weight: 700; }
  .primary { background: var(--accent); color: #fff; }
  .ghost { background: var(--accent-soft); color: var(--accent); }
  .small { font-size: 13px; padding: 6px 10px; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .row { display: flex; gap: 8px; }
  .row > .grow { flex: 1; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chip { font-size: 13px; padding: 6px 12px; border-radius: 999px; background: #fff; border: 1px solid var(--line); color: var(--muted); font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip .x { font-size: 12px; opacity: .8; padding: 0 2px; }
  .search { flex: 1; min-width: 140px; padding: 7px 12px; border-radius: 999px; font-size: 14px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li.todo { padding: 12px 4px; border-bottom: 1px solid var(--line); }
  li.todo:last-child { border-bottom: 0; }
  .line { display: flex; gap: 12px; align-items: flex-start; }
  .line input[type=checkbox] { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; padding: 0; }
  .body { flex: 1; min-width: 0; }
  .t { font-size: 16px; word-break: break-word; }
  li.done .t { text-decoration: line-through; color: var(--muted); }
  .memo { font-size: 13px; color: var(--muted); margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: #f0eef9; color: var(--muted); font-weight: 600; }
  .badge.today { background: var(--warn-soft); color: var(--warn); }
  .badge.over, .badge.high { background: var(--danger-soft); color: var(--danger); }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.turtle { background: #e9f6ea; color: #3b7d3f; }
  .actions { display: flex; gap: 2px; flex: none; }
  .icon { background: transparent; color: var(--muted); padding: 4px 8px; font-size: 16px; line-height: 1; }
  .icon:hover { background: var(--accent-soft); color: var(--accent); }
  .icon.del:hover { color: var(--danger); background: var(--danger-soft); }
  .mood { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 10px 0 0 32px; padding: 10px 12px; background: var(--accent-soft); border-radius: 12px; font-size: 14px; }
  .mood button.e { font-size: 22px; background: #fff; padding: 4px 10px; }
  .mood button.e:hover { transform: scale(1.12); }
  .empty { text-align: center; color: var(--muted); padding: 28px 0; }
  .msg { font-size: 14px; padding: 10px 12px; border-radius: 10px; display: none; }
  .msg.show { display: block; }
  .msg.err { background: var(--danger-soft); color: var(--danger); }
  .msg.info { background: var(--accent-soft); color: var(--accent); }
  .who { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .login h2 { margin: 0 0 4px; font-size: 18px; }
  .login p { margin: 0; color: var(--muted); font-size: 14px; }
  .count { font-size: 13px; color: var(--muted); }
  @media (max-width: 520px) { .grid4 { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div class="wrap stack">
  <header>
    <h1>📝 My Todo</h1>
    <span class="mode" id="mode">불러오는 중…</span>
  </header>

  <div class="msg" id="msg"></div>

  <!-- 로그인 화면 (클라우드 버전에서만 보임) -->
  <section class="card login stack" id="loginBox" hidden>
    <div>
      <h2>로그인</h2>
      <p>내 할 일은 나만 볼 수 있어요.</p>
    </div>
    <input id="email" type="email" placeholder="이메일" autocomplete="email">
    <input id="password" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password">
    <div class="row">
      <button class="primary grow" id="loginBtn">로그인</button>
      <button class="ghost grow" id="signupBtn">회원가입</button>
    </div>
  </section>

  <!-- Todo 화면 -->
  <div class="stack" id="app" hidden>
    <div class="who" id="whoBox" hidden>
      <span>🙂 <b id="whoEmail"></b> 님의 할 일</span>
      <button class="ghost small" id="logoutBtn">로그아웃</button>
    </div>

    <!-- 할 일 추가 -->
    <form class="card stack" id="addForm">
      <div class="row">
        <input class="grow" id="title" placeholder="할 일을 적어 주세요 (예: 과제 제출하기)" maxlength="200" required>
        <button class="primary" type="submit">추가</button>
      </div>
      <div class="grid4">
        <label class="f">우선순위
          <select id="priority">
            <option value="high">🔥 높음</option>
            <option value="normal" selected>보통</option>
            <option value="low">💤 낮음</option>
          </select>
        </label>
        <label class="f">마감일<input id="due" type="date"></label>
        <label class="f">예상 시간
          <select id="est">
            <option value="">모름</option>
            <option value="10">10분</option>
            <option value="30">30분</option>
            <option value="60">1시간</option>
            <option value="120">2시간</option>
            <option value="240">반나절</option>
          </select>
        </label>
        <label class="f">카테고리<select id="category"></select></label>
      </div>
      <input id="memo" style="width:100%" placeholder="메모 (선택)" maxlength="1000">
    </form>

    <!-- 카테고리 -->
    <div class="filters" id="catFilters"></div>
    <form class="card row" id="catForm" hidden>
      <input id="catEmoji" placeholder="📚" maxlength="8" style="width:64px;text-align:center">
      <input class="grow" id="catName" placeholder="새 카테고리 이름 (예: 공부)" maxlength="20" required>
      <input id="catColor" type="color" value="#7c6cf2" title="색 고르기">
      <button class="primary" type="submit">만들기</button>
    </form>

    <!-- 상태·검색 -->
    <div class="filters">
      <button class="chip on" data-status="all">전체</button>
      <button class="chip" data-status="active">진행 중</button>
      <button class="chip" data-status="done">완료</button>
      <button class="chip" data-status="quick">⏱ 30분 이하</button>
      <input class="search" id="search" placeholder="🔍 제목·메모 검색">
    </div>

    <section class="card">
      <div class="count" id="count"></div>
      <ul id="list"></ul>
    </section>
  </div>
</div>

<script>
// 이 화면 코드는 DB를 직접 부르지 않아요. 오직 백엔드의 /api/... 에만 요청합니다.
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const state = { status: 'all', category: '', q: '', authRequired: false, moodFor: null, editCats: false, categories: [], todos: [] };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};

function showMsg(text, kind = 'err') {
  const m = $('msg');
  m.textContent = text; m.className = `msg show ${kind}`;
  clearTimeout(showMsg.t); showMsg.t = setTimeout(() => (m.className = 'msg'), 5000);
}

// ---------- 백엔드 API 호출 ----------
async function api(path, options = {}, retried = false) {
  const headers = { 'Content-Type': 'application/json' };
  const token = store.get('access_token');
  if (token) headers.Authorization = `Bearer ${token}`;
  const res = await fetch(path, { ...options, headers });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && state.authRequired && !retried && store.get('refresh_token')) {
    if (await refresh()) return api(path, options, true);
  }
  if (res.status === 401 && state.authRequired) { logout(); throw new Error(data.error || '다시 로그인해 주세요.'); }
  if (!res.ok) throw new Error(data.error || `요청 실패 (${res.status})`);
  return data;
}

async function refresh() {
  try {
    const res = await fetch('/api/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: store.get('refresh_token') }) });
    if (!res.ok) return false;
    saveSession(await res.json());
    return true;
  } catch { return false; }
}

// ---------- 로그인 (클라우드 버전) ----------
function saveSession(s) {
  store.set('access_token', s.access_token);
  store.set('refresh_token', s.refresh_token);
  if (s.email) store.set('email', s.email);
}
function logout() {
  ['access_token', 'refresh_token', 'email'].forEach((k) => store.set(k, null));
  showScreen(false);
}
function showScreen(loadData = true) {
  const loggedIn = !state.authRequired || !!store.get('access_token');
  $('loginBox').hidden = loggedIn;
  $('app').hidden = !loggedIn;
  $('whoBox').hidden = !state.authRequired;
  $('whoEmail').textContent = store.get('email') || '';
  if (loggedIn && loadData) load();
}
async function auth(kind) {
  const email = $('email').value.trim(), password = $('password').value;
  if (!email || !password) return showMsg('이메일과 비밀번호를 입력해 주세요.');
  try {
    const data = await api(`/api/${kind}`, { method: 'POST', body: JSON.stringify({ email, password }) });
    if (data.access_token) { saveSession(data); $('password').value = ''; state.category = ''; showScreen(); }
    else showMsg(data.message || '가입 완료! 이제 로그인해 주세요.', 'info');
  } catch (e) { showMsg(e.message); }
}

// ---------- 데이터 불러오기 ----------
async function load() {
  try {
    const params = new URLSearchParams();
    if (state.q) params.set('q', state.q);
    if (state.category) params.set('category', state.category);
    const [todos, categories] = await Promise.all([api('/api/todos?' + params), api('/api/categories')]);
    state.todos = todos; state.categories = categories;
    if (state.category && state.category !== 'none' && !categories.some((c) => String(c.id) === state.category)) {
      state.category = ''; return load();
    }
    render();
  } catch (e) { showMsg(e.message); }
}

function render() { renderCategorySelect(); renderCategoryChips(); renderList(); }

function renderCategorySelect() {
  const sel = $('category'), keep = sel.value;
  sel.replaceChildren(new Option('미분류', ''));
  for (const c of state.categories) sel.append(new Option(`${c.emoji} ${c.name}`, c.id));
  sel.value = state.categories.some((c) => String(c.id) === keep) ? keep : '';
}

function renderCategoryChips() {
  const box = $('catFilters');
  box.replaceChildren();
  const chip = (label, value, color) => {
    const b = el('button', 'chip' + (state.category === value ? ' on' : ''), label);
    if (color && state.category !== value) { b.style.borderColor = color; b.style.color = color; }
    if (color && state.category === value) { b.style.background = color; b.style.borderColor = color; }
    b.onclick = () => { state.category = value; load(); };
    return b;
  };
  box.append(chip('모든 카테고리', ''));
  for (const c of state.categories) {
    const b = chip(`${c.emoji} ${c.name} ${c.todo_count}`, String(c.id), c.color);
    if (state.editCats) {
      const x = el('span', 'x', '✕');
      x.title = '카테고리 삭제 (할 일은 미분류로 남아요)';
      x.onclick = async (ev) => {
        ev.stopPropagation();
        if (!confirm(`'${c.name}' 카테고리를 지울까요?\n안에 있던 할 일 ${c.todo_count}개는 '미분류'로 남아요.`)) return;
        try { await api(`/api/categories/${c.id}`, { method: 'DELETE' }); load(); } catch (e) { showMsg(e.message); }
      };
      b.append(x);
    }
    box.append(b);
  }
  box.append(chip('미분류', 'none'));
  const add = el('button', 'chip', '＋ 카테고리');
  add.onclick = () => { $('catForm').hidden = !$('catForm').hidden; if (!$('catForm').hidden) $('catName').focus(); };
  box.append(add);
  if (state.categories.length) {
    const edit = el('button', 'chip' + (state.editCats ? ' on' : ''), state.editCats ? '편집 끝' : '✏️ 편집');
    edit.onclick = () => { state.editCats = !state.editCats; renderCategoryChips(); };
    box.append(edit);
  }
}

// ---------- 할 일 목록 ----------
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }

function dueBadge(t) {
  const diff = Math.round((new Date(t.due_date + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / 86400000);
  if (t.done) return el('span', 'badge', `📅 ${t.due_date}`);
  return el('span', 'badge ' + (diff < 0 ? 'over' : diff === 0 ? 'today' : ''),
    `📅 ${t.due_date} ` + (diff < 0 ? `(${-diff}일 지남)` : diff === 0 ? '(오늘!)' : `(D-${diff})`));
}

function minutesText(m) { return m >= 60 ? `${m / 60 % 1 ? (m / 60).toFixed(1) : m / 60}시간` : `${m}분`; }

function renderList() {
  const todos = state.todos;
  const shown = todos.filter((t) =>
    state.status === 'all' ||
    (state.status === 'active' && !t.done) ||
    (state.status === 'done' && t.done) ||
    (state.status === 'quick' && !t.done && t.estimated_minutes && t.estimated_minutes <= 30));
  const left = todos.filter((t) => !t.done).length;
  $('count').textContent = `할 일 ${todos.length}개 · 남은 일 ${left}개`;
  const ul = $('list');
  ul.replaceChildren();
  if (!shown.length) {
    ul.append(el('li', 'empty', todos.length ? '이 조건에 맞는 할 일이 없어요.' : '아직 할 일이 없어요. 위에서 추가해 보세요! 🌱'));
    return;
  }
  for (const t of shown) ul.append(todoItem(t));
}

function todoItem(t) {
  const li = el('li', 'todo' + (t.done ? ' done' : ''));
  const line = el('div', 'line');

  // 완료 체크 → 체크하면 바로 기분 물어보기
  const cb = el('input');
  cb.type = 'checkbox'; cb.checked = t.done || state.moodFor === t.id; cb.title = '완료 표시';
  cb.onchange = async () => {
    if (cb.checked) { state.moodFor = t.id; renderList(); return; }
    if (state.moodFor === t.id) { state.moodFor = null; renderList(); return; }
    try { await api(`/api/todos/${t.id}`, { method: 'PATCH', body: JSON.stringify({ done: false }) }); load(); }
    catch (e) { showMsg(e.message); load(); }
  };

  const body = el('div', 'body');
  body.append(el('div', 't', t.title));                      // textContent → 이상한 글자도 안전하게 표시
  const meta = el('div', 'meta');
  if (t.priority === 'high') meta.append(el('span', 'badge high', '🔥 높음'));
  if (t.priority === 'low') meta.append(el('span', 'badge', '💤 낮음'));
  if (t.category_name) {
    const c = el('span', 'badge', `${t.category_emoji} ${t.category_name}`);
    c.style.background = t.category_color + '22'; c.style.color = t.category_color;
    meta.append(c);
  }
  if (t.due_date) meta.append(dueBadge(t));
  if (t.estimated_minutes) meta.append(el('span', 'badge', `⏱ ${minutesText(t.estimated_minutes)}`));
  if (t.postpone_count > 0) {
    meta.append(el('span', 'badge turtle', t.postpone_count >= 3 ? `🐢 만성 미룸러 (${t.postpone_count}번 미룸)` : `⏭ ${t.postpone_count}번 미룸`));
  }
  if (t.done && t.completed_at) {
    const when = t.completed_at.replace('T', ' ').slice(5, 16).replace('-', '/');
    meta.append(el('span', 'badge ok', `✅ ${when} 완료 ${t.mood || ''}`.trim()));
    if (t.due_date) {
      const onTime = t.completed_at.slice(0, 10) <= t.due_date;
      meta.append(el('span', 'badge ' + (onTime ? 'ok' : 'over'), onTime ? '👍 마감 전에 끝냄' : '마감 지나서 끝냄'));
    }
  }
  if (meta.childElementCount) body.append(meta);
  if (t.memo) body.append(el('div', 'memo', `📝 ${t.memo}`));

  const actions = el('div', 'actions');
  if (!t.done) {
    const later = el('button', 'icon', '⏭');
    later.title = '내일로 미루기 (마감일 +1일, 미룬 횟수 +1)';
    later.onclick = async () => {
      try { await api(`/api/todos/${t.id}/postpone`, { method: 'POST' }); showMsg('내일로 미뤘어요. 내일의 나, 화이팅! 🐢', 'info'); load(); }
      catch (e) { showMsg(e.message); }
    };
    actions.append(later);
  }
  const del = el('button', 'icon del', '✕');
  del.title = '삭제';
  del.onclick = async () => {
    try { await api(`/api/todos/${t.id}`, { method: 'DELETE' }); load(); }
    catch (e) { showMsg(e.message); }
  };
  actions.append(del);

  line.append(cb, body, actions);
  li.append(line);

  // 기분 고르기 창
  if (state.moodFor === t.id) {
    const box = el('div', 'mood');
    box.append(el('span', '', '끝냈어요! 기분이 어땠어요?'));
    const finish = async (mood) => {
      try {
        await api(`/api/todos/${t.id}`, { method: 'PATCH', body: JSON.stringify({ done: true, mood }) });
        state.moodFor = null; load();
      } catch (e) { showMsg(e.message); }
    };
    for (const m of ['😊', '😐', '😫']) { const b = el('button', 'e', m); b.type = 'button'; b.onclick = () => finish(m); box.append(b); }
    const skip = el('button', 'ghost small', '건너뛰기'); skip.type = 'button'; skip.onclick = () => finish(null);
    box.append(skip);
    li.append(box);
  }
  return li;
}

// ---------- 이벤트 연결 ----------
$('addForm').onsubmit = async (ev) => {
  ev.preventDefault();
  const title = $('title').value.trim();
  if (!title) return;
  try {
    await api('/api/todos', { method: 'POST', body: JSON.stringify({
      title, memo: $('memo').value.trim() || null, priority: $('priority').value,
      due_date: $('due').value || null, estimated_minutes: $('est').value || null,
      category_id: $('category').value || null,
    }) });
    ['title', 'memo', 'due', 'est', 'category'].forEach((id) => ($(id).value = ''));
    $('priority').value = 'normal';
    $('title').focus();
    load();
  } catch (e) { showMsg(e.message); }
};

$('catForm').onsubmit = async (ev) => {
  ev.preventDefault();
  try {
    await api('/api/categories', { method: 'POST', body: JSON.stringify({
      name: $('catName').value.trim(), emoji: $('catEmoji').value.trim() || null, color: $('catColor').value,
    }) });
    $('catName').value = ''; $('catEmoji').value = ''; $('catForm').hidden = true;
    load();
  } catch (e) { showMsg(e.message); }
};

document.querySelectorAll('[data-status]').forEach((b) => (b.onclick = () => {
  state.status = b.dataset.status;
  document.querySelectorAll('[data-status]').forEach((x) => x.classList.toggle('on', x === b));
  renderList();
}));

let searchTimer;
$('search').oninput = () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.q = $('search').value.trim(); load(); }, 250);
};

$('loginBtn').onclick = () => auth('login');
$('signupBtn').onclick = () => auth('signup');
$('password').onkeydown = (e) => { if (e.key === 'Enter') auth('login'); };
$('logoutBtn').onclick = () => logout();

(async function start() {
  try {
    const cfg = await (await fetch('/api/config')).json();
    state.authRequired = cfg.authRequired;
    $('mode').textContent = (cfg.mode === 'local' ? '💾 ' : '☁️ ') + cfg.label;
  } catch { $('mode').textContent = '서버 연결 안 됨'; showMsg('서버가 꺼져 있어요. 실행 파일(start.bat)을 다시 켜 주세요.'); return; }
  showScreen();
})();
</script>
</body>
